<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Allez Fencing Academy | Member Login</title>
  <meta name="description" content="Log in to your Allez Fencing Academy profile. Access exclusive member training calendars, event lists, and NCAA profiles.">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom Styles -->
  <link rel="stylesheet" href="assets/css/custom.css">
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'gold-accent': {
              DEFAULT: '#8B5A2B',
              hover: '#7C5026',
              dark: '#6D4621',
            },
            'charcoal': {
              900: '#0a0a0a',
              800: '#161616',
              700: '#1f1f1f',
              600: '#2e2e2e',
            }
          },
          fontFamily: {
            serif: ['Cinzel', 'serif'],
            sans: ['Outfit', 'sans-serif'],
          },
          fontWeight: {
            light: '300',
            normal: '410',
            medium: '500',
            semibold: '520',
            bold: '500',
            extrabold: '540',
            black: '580',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white dark:bg-charcoal-900 text-gray-900 dark:text-gray-100 transition-colors duration-300">

  <!-- Floating Toggles -->
  <div class="fixed top-4 right-4 z-50 flex items-center gap-2">
    <!-- Theme Toggle -->
    <button class="theme-toggle-btn bg-white dark:bg-charcoal-800 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-white focus:outline-none p-2.5 rounded-full shadow-md hover:shadow-lg hover:bg-gray-50 dark:hover:bg-white/10 transition-all" title="Toggle Theme">
      <i class="theme-toggle-icon fas fa-sun text-yellow-400 text-sm"></i>
    </button>
    <!-- RTL Toggle -->
    <button class="rtl-toggle-btn bg-white dark:bg-charcoal-800 border border-gray-200 dark:border-white/10 text-gray-600 dark:text-white focus:outline-none p-2.5 rounded-full shadow-md hover:shadow-lg hover:bg-gray-50 dark:hover:bg-white/10 transition-all" title="Toggle RTL/LTR">
      <i class="fas fa-right-left text-gold-accent text-sm"></i>
    </button>
  </div>

  <!-- LOGIN SECTION -->
  <section class="min-h-screen flex items-center justify-center py-12 bg-white dark:bg-charcoal-900">
    

    <!-- Login Form -->
    <div class="w-full max-w-md mx-auto px-4 sm:px-6">
      <div class="w-full space-y-8 bg-white dark:bg-charcoal-800 border border-gray-200 dark:border-white/10 rounded-2xl shadow-xl dark:shadow-black/40 px-8 py-10">
        
        <!-- Logo -->
        <div class="text-center mb-2">
          <a href="index.html" class="inline-flex items-center gap-2 font-serif tracking-widest text-2xl font-bold group">
            <span class="text-gold-accent group-hover:opacity-80 transition-opacity">
              <i class="fas fa-shield-halved"></i>
            </span>
            <span class="text-gray-900 dark:text-white">ALLEZ</span>
          </a>
        </div>

        <div class="space-y-2 text-center">
          <h2 class="font-serif font-bold text-3xl text-gray-900 dark:text-white">Sign In</h2>
          <p class="text-xs text-gray-500 dark:text-gray-400">Welcome back to the Allez Academy member zone.</p>
        </div>

        <form id="login-form" class="space-y-6">
          
          <div>
            <label for="email" class="block text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-2">Email Address</label>
            <input type="email" id="email" required class="w-full bg-slate-50 dark:bg-charcoal-800 border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white rounded-lg px-4 py-3.5 text-xs focus:outline-none focus:border-gold-accent transition-colors">
          </div>

          <div>
            <label for="password" class="block text-[10px] uppercase tracking-wider text-gray-400 font-bold mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" required class="w-full bg-slate-50 dark:bg-charcoal-800 border border-gray-200 dark:border-white/10 text-gray-900 dark:text-white rounded-lg px-4 py-3.5 text-xs focus:outline-none focus:border-gold-accent transition-colors pr-10">
              <button type="button" class="password-toggle absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gold-accent focus:outline-none" aria-label="Toggle Password Visibility">
                <i class="fas fa-eye text-xs"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs">
            <label class="flex items-center space-x-2 gap-1.5 text-gray-500 dark:text-gray-400">
              <input type="checkbox" class="rounded border-gray-300 text-gold-accent focus:ring-gold-accent bg-transparent">
              <span>Remember Me</span>
            </label>
            <a href="#" class="text-gold-accent hover:underline">Forgot Password?</a>
          </div>

          <div>
            <button type="submit" class="w-full py-4 text-xs font-bold uppercase tracking-widest text-[#121212] bg-gold-accent hover:bg-gold-accent-hover rounded-full transition-colors shadow-lg">Login</button>
          </div>

        </form>

        <div class="relative flex py-2 items-center">
          <div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
          <span class="flex-shrink mx-4 text-[10px] text-gray-400 uppercase tracking-widest font-semibold">Or continue with</span>
          <div class="flex-grow border-t border-gray-200 dark:border-white/10"></div>
        </div>

        <div class="flex justify-center gap-4">
          <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:border-gold-accent dark:hover:border-gold-accent hover:text-gold-accent dark:hover:text-gold-accent transition-colors bg-slate-50 dark:bg-charcoal-700/30">
            <i class="fab fa-google text-sm"></i>
          </a>
          <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:border-gold-accent dark:hover:border-gold-accent hover:text-gold-accent dark:hover:text-gold-accent transition-colors bg-slate-50 dark:bg-charcoal-700/30">
            <i class="fab fa-apple text-sm"></i>
          </a>
          <a href="#" class="flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 dark:border-white/10 text-gray-600 dark:text-gray-300 hover:border-gold-accent dark:hover:border-gold-accent hover:text-gold-accent dark:hover:text-gold-accent transition-colors bg-slate-50 dark:bg-charcoal-700/30">
            <i class="fab fa-facebook-f text-sm"></i>
          </a>
        </div>

        <div class="text-center text-xs text-gray-500 dark:text-gray-400 mt-4">
          <p>Don't have an account? <a href="signup.html" class="text-gold-accent font-semibold hover:underline">Create Account</a></p>
        </div>

      </div>
    </div>

  </section>

  <!-- Core JavaScript -->
  <script src="assets/js/main.js"></script>
</body>
</html>
